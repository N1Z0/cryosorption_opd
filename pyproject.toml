[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opd"
version = "0.1.0"
description = "Lumped-parameter thermodynamic model for cryogenic hydrogen storage with adsorbent-assisted ullage control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OPD contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "CoolProp>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["opd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
